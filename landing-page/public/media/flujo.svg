  <text x="40" y="516" fill="#5d5d5d" font-family="ui-sans-serif, sans-serif" font-size="15">Si la pieza no está en las bibliotecas, no se dibuja otra en su lugar. El editor de esquemáticos tiene que estar cerrado para escribir.</text>
