name: Versión

# Cada push o merge a main calcula la versión siguiente y crea el tag vX.Y.Z.
# El tag es lo que dispara release.yml.
#
# Un tag creado con el token de Actions no dispara otros workflows: este
# workflow lanza release.yml después de crearlo. RELEASE_TOKEN es opcional y
# solo sirve para que el propio tag dispare el release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Forzar el nivel de la versión
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  actions: write

concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  tag:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcular versión
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ -n "$BUMP" ] && [ "$BUMP" != "auto" ]; then
            python .github/scripts/next_version.py --bump "$BUMP"
          else
            python .github/scripts/next_version.py
          fi

      - name: Crear tag
        id: tag
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
          PREVIOUS: ${{ steps.next.outputs.previous }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "El tag $TAG ya existe"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "KiCad IA $TAG" -m "Anterior: ${PREVIOUS:-ninguno}"
          push_tag() {
            git push "https://x-access-token:${1}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
          }
          triggered=false
          if [ -n "$RELEASE_TOKEN" ]; then
            set +e
            push_tag "$RELEASE_TOKEN"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              triggered=true
            else
              echo "RELEASE_TOKEN no pudo publicar el tag. Se usa el token de Actions."
            fi
          fi
          if [ "$triggered" != true ]; then
            push_tag "$ACTIONS_TOKEN"
          fi
          echo "triggered=$triggered" >> "$GITHUB_OUTPUT"

      - name: Lanzar release
        if: steps.tag.outputs.triggered == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG" -f tag="$TAG"
