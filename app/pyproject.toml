[project]
name = "kicad-ia"
version = "0.1.0"
description = "Plugin conversacional de KiCad para esquemático, PCB, bibliotecas y ruteo."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2",
  "uvicorn>=0.32",
  "websockets>=13",
  "easyeda2kicad>=0.9",
  "eval_type_backport>=0.2; python_version < '3.10'",
]

[project.optional-dependencies]
kicad = ["kicad-python>=0.4"]
mcp = ["mcp>=1.9,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mcp>=1.9,<2"]

[project.scripts]
kicad-ia = "kicad_ia.__main__:main"
kicad-ia-mcp = "kicad_ia.mcp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kicad_ia = ["server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
